services:
  robot-arm:
    build: .
    platform: linux/amd64   # Gazebo Classic has no arm64 build, see Dockerfile
    image: robot-arm
    container_name: robot-arm
    ports:
      - "127.0.0.1:6080:80"     # desktop: http://localhost:6080 (this machine only)
      - "127.0.0.1:9090:9090"   # rosbridge, unauthenticated: anyone who reaches it drives the arm
    shm_size: 2gb
    volumes:
      - ../ros_ws:/ws   # arm_node + sim world; keep the clone out of iCloud ~/Documents, Docker can't read evicted files
    restart: unless-stopped
