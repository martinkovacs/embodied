services:
  robot-arm:
    build: .
    platform: linux/amd64   # Gazebo Classic has no arm64 build, see Dockerfile
    image: robot-arm
    container_name: robot-arm
    ports:
      - "6080:80"     # desktop: http://localhost:6080
      - "9090:9090"   # rosbridge (host Python code connects here)
    shm_size: 2gb
    volumes:
      - ../ros_ws:/ws   # arm_node + sim world; keep the clone out of iCloud ~/Documents, Docker can't read evicted files
    restart: unless-stopped
